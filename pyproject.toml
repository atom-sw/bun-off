[project]
name = "bun-off"
version = "0.5.0"
description = "A tool to configure different agentic coding frameworks consistently across installations."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Carlo A. Furia", email = "furiac@usi.ch"}
]
keywords = ["ai", "coding-agent", "claude", "opencode", "antigravity", "mcp", "configuration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
    "pytest-cov>=4.1",
    "ruff>=0.15",
    "types-PyYAML",
]

[project.scripts]
boff = "boff.cli:main"

[project.urls]
Homepage = "https://github.com/atom-sw/bun-off"
Repository = "https://github.com/atom-sw/bun-off"
Issues = "https://github.com/atom-sw/bun-off/issues"
Changelog = "https://github.com/atom-sw/bun-off/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boff"]

[tool.hatch.build.targets.sdist]
# Anchored with a leading slash: hatchling's patterns are gitignore-style, so a bare
# `README.md` would also sweep in every `bundles/*/README.md`.
include = ["/src/boff", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=boff",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["src/boff"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # pylint
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",     # line too long (handled by ruff format)
    "PLR6301",  # "method could be static": collides with registry dispatch pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC2701"]  # Allow magic values and private-name imports in tests

[tool.pyright]
include = ["src/boff", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
